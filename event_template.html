<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="./template.css" />
  <title>Event Signup - PiXELL River Financial</title>
</head>
<body>

  <header>
    <h1 class="header-class">PiXELL River Financial</h1>
  </header>

  <main>
    <h2>Event Signup Form</h2>
    <form id="eventForm">
      <div class="form-group">
        <label for="eventName">Event Name:</label><br>
        <input type="text" id="eventName" placeholder="Enter the name of the event" /><br>
        <span class="error" id="eventNameError"></div>
      </div>

      <div class="form-group">
        <label for="repName">Representative's Name:</label><br>
        <input type="text" id="repName" placeholder="Enter your full name" /><br>
        <span class="error" id="repNameError"></span>
      </div>

      <div class="form-group">
        <label for="repEmail">Representative's Email:</label><br>
        <input type="email" id="repEmail" placeholder="Enter your email address" /><br>
        <span class="error" id="repEmailError"></span>
      </div>

      <div class="form-group">
        <label for="role">Role at Event:</label><br>
        <select id="role">
          <option value="">-- Select Role --</option>
          <option value="Sponsor">Sponsor</option>
          <option value="Participant">Participant</option>
          <option value="Organizer">Organizer</option>
        </select><br>
        <span class="error" id="roleError"></span>
      </div>

      <button type="submit" class="button-class">Submit</button>
    </form>
    <hr>
    <table id="signupTable">
      <thead>
          <tr>
            <th>Event Name</th>
            <th>Participant Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Action</th>
            <br>
          </tr>
      </thead>
      <tbody>
      </tbody>
    </table>

    <div class="summary" id="summary"></div>
  </main>

  <footer class="footer-class">
    <hr>
    <p>&copy; 2025 PiXELL River Financial</p>
  </footer>

  <script src="./event.js"></script>
</body>
</html>
