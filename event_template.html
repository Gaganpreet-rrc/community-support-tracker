<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="./template.css" />
  <title>Event Signup - PiXELL River Financial</title>
</head>
<body>

  <header>
    <h1 class="header-class">PiXELL River Financial

    </h1>
  </header>
  <hr>
  <main>
    <h2>Event Signup Form</h2>
    <form id="eventForm">
      <div class="form-group">
        <label for="eventName">Event Name:</label><br>
        <input type="text" id="eventName" placeholder="Enter the name of the event" />
      </div>

      <div class="form-group">
        <label for="repName">Representative's Name:</label><br>
        <input type="text" id="repName" placeholder="Enter your full name" />
      </div>

      <div class="form-group">
        <label for="repEmail">Representative's Email:</label><br>
        <input type="email" id="repEmail" placeholder="Enter your email address" />
      </div>

      <div class="form-group">
        <label for="role">Role at Event:</label><br>
        <select id="role">
          <option value="">-- Select Role --</option>
          <option value="Sponsor">Sponsor</option>
          <option value="Participant">Participant</option>
          <option value="Organizer">Organizer</option>
        </select>
      </div>

      <button type="submit" class="button-class">Submit</button>
    </form>
  </main>

  <footer class="footer-class">
    <hr>
    <p>&copy; 2025 PiXELL River Financial</p>
  </footer>

  <script src="./event.js"></script>
</body>
</html>
