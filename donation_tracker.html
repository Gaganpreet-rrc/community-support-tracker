<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./template.css" />
    <title>Donation Tracker</title>
</head>

<body>

    <header>
        <h1 class="header-class">PIXELL River Financial</h1>
    </header>
    <main>
        <h2>Donation Tracker Portal</h2>
        <form id="donation">

            <div class="form-group">
                <label for="charity-name" class="bolding">Charity Name:</label><br>
                <input type="text" id="charity-name" name="charity-name" placeholder="Enter Name of charity"><br>
                <span class="error" id="name-error"></span>
            </div>

            <div class="form-group">
                <label for="charity-amount" class="bolding">Donation Amount:</label><br>
                <input type="number" id="charity-amount" name="charity-amount" placeholder="Enter Donation Amount"><br>
                <span class="error" id="amount-error"></span>
            </div>

            <div class="form-group">
                <label for="charity-donation-date" class="bolding">Donation Amount:</label><br>
                <input type="date" id="charity-donation-date" name="charity-donation-date"
                    placeholder="Choose donation date"><br>
                <span class="error" id="date-error"></span>
            </div>

            <div class="form-group">
                <label for="donor-message" class="bolding">Donation Message:</label><br>
                <input type="text" id="donor-message" name="donor-message" placeholder="Enter a message"><br>
                <span class="error" id="message-error"></span>
            </div>

            <div>
                <button type="submit" class="button-class">Add Donation</button>
            </div>

        </form>

    </main>
    <hr>
    <footer class="footer-class">
        <p> &copy; 2025 Donation Tracker Portal. All rights reserved.</p>
    </footer>
    <script src="./donation_tracker.js"></script>
</body>

</html>
